version = "0.0.1"
authors = []
description = ""
readme = "README.md"
license-files = []
urls.Repository = "https://github.com/imbobz/NetworkComputing"
urls.Issues = "https://github.com/imbobz/NetworkComputing/issues"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]
requires-python = ">=3.13"
